    .ooo-exhibit *, .ooo-exhibit *::before, .ooo-exhibit *::after {
      box-sizing: border-box;
    }
    .ooo-exhibit__pair {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      align-items: start;
      justify-items: center;
      gap: clamp(8px, 2vw, 24px);
      width: min(100%, 864px);
      margin-inline: auto;
    }
    .ooo-device {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 863 / 1823;
      margin: 0;
      padding: 0;
      background: transparent;
    }
    /* The exact transparent device design is embedded once and reused.
       It overlays the original photographs without changing their pixels. */
    .ooo-device::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image: var(--ooo-device-frame);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }
    .ooo-device__screen {
      container-type: inline-size;
      position: absolute;
      z-index: 1;
      top: 5.27%;
      left: 11.12%;
      display: block;
      width: 77.87%;
      height: 87.45%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 10.7% / 4.5%;
      background: #040608;
      color: inherit;
      appearance: none;
      cursor: zoom-in;
      -webkit-tap-highlight-color: transparent;
    }
    .ooo-device__image {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      /* CSS changes only the visible crop. Embedded JPEG bytes are unchanged. */
      object-position: var(--ooo-photo-position, 50% 50%);
    }
    .ooo-device--saxophone { --ooo-photo-position: 25% 50%; }
    .ooo-device--wheel { --ooo-photo-position: 35% 50%; }
    /* A transparent, accessible hit target over the frame's centre control. */
    .ooo-device__expand {
      position: absolute;
      z-index: 3;
      left: 41.5%;
      bottom: 4%;
      width: 17%;
      height: 3.4%;
      min-height: 24px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      appearance: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ooo-device__expand:hover { background: rgb(106 227 224 / 12%); }
    .ooo-device__expand:focus-visible,
    .ooo-exhibit__close:focus-visible {
      outline: 2px solid var(--ooo-led);
      outline-offset: 2px;
    }
    .ooo-device__screen:focus-visible {
      outline: 2px solid var(--ooo-led);
      outline-offset: -5px;
    }
    /* This bounded panel keeps a clear strip of photograph below the message.
       It grows upward as needed for readable text in the enlarged view. */
    .ooo-purpose {
      position: absolute;
      z-index: 1;
      inset: auto 2.5% 7%;
      min-height: 29%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.5cqw, 6px);
      padding: 10px clamp(10px, 4cqw, 22px);
      border: 1px solid #0F031C;
      border-radius: clamp(14px, 5cqw, 20px);
      background: linear-gradient(140deg,
        rgb(45 29 63 / 96%) 0%,
        rgb(25 14 39 / 96%) 48%,
        rgb(12 7 23 / 97%) 100%);
      box-shadow:
        5px 7px 12px rgb(2 0 8 / 46%),
        -2px -2px 7px rgb(181 148 222 / 10%),
        inset 1px 1px 2px rgb(220 194 255 / 24%),
        inset -3px -4px 7px rgb(2 0 8 / 62%);
      text-shadow: 0 1px 1px rgb(3 1 8 / 70%);
      color: #f3edf9;
      font-family: inherit;
      text-align: center;
      pointer-events: none;
    }
    .ooo-purpose__title {
      display: block;
      margin: 0;
      color: #f4eefe;
      font-size: clamp(12px, 5cqw, 18px);
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: .035em;
      white-space: nowrap;
    }
    .ooo-purpose__lead {
      display: block;
      color: #cfc0de;
      font-size: clamp(10px, 3.4cqw, 12px);
      font-weight: 400;
      line-height: 1.3;
    }
    .ooo-purpose__triad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      max-width: 380px;
      margin: 4px auto 0;
      padding: 7px 6px 8px;
      border: 1px solid rgb(6 2 13 / 60%);
      border-radius: 12px;
      background: rgb(21 11 35 / 42%);
      box-shadow:
        inset 2px 2px 5px rgb(1 0 6 / 52%),
        inset -1px -1px 3px rgb(183 150 225 / 14%);
    }
    .ooo-purpose__entry {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: clamp(5px, 1.8cqw, 8px);
    }
    .ooo-purpose__icon {
      display: block;
      width: clamp(30px, 9cqw, 34px);
      height: clamp(30px, 9cqw, 34px);
      color: #d9c7f5;
      filter: drop-shadow(0 1px 1px rgb(3 1 10 / 64%));
    }
    .ooo-purpose__icon--banknote {
      width: clamp(40px, 12cqw, 45.3px);
      max-width: 100%;
    }
    .ooo-purpose__accent {
      stroke: #5B04DE;
      stroke-width: 1.8;
    }
    .ooo-purpose__label {
      position: relative;
      display: inline-block;
      color: #eee5fb;
      font-size: clamp(10px, 3.5cqw, 12px);
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: .13em;
      white-space: nowrap;
    }
    .ooo-purpose__music {
      display: block;
      flex: none;
      width: clamp(22px, 7cqw, 26px);
      height: clamp(22px, 7cqw, 26px);
      color: #d9c7f5;
    }
    /* The heart is anchored to the model's left chest in source-photo space. */
    .ooo-heart {
      position: absolute;
      z-index: 1;
      left: 58%;
      top: 64.0625%;
      width: max(166px, 74%);
      max-width: 82%;
      aspect-ratio: 300 / 290;
      transform: translate(-50%, -50%);
      color: #F0F4F5;
      pointer-events: none;
      transition: transform 120ms ease;
    }
    .ooo-device--wheel .ooo-device__screen:active .ooo-heart {
      transform: translate(-50%, calc(-50% + 2px)) scale(.988);
    }
    .ooo-heart > svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .ooo-exhibit__full-view .ooo-heart {
      left: 47.9167%;
      width: clamp(190px, 41.6667%, 300px);
      max-width: 80%;
    }
    .ooo-exhibit__full-view {
      position: relative;
      width: min(720px, calc((100vh - 96px) * .75), calc(100vw - 58px));
      width: min(720px, calc((100dvh - 96px) * .75), calc(100vw - 58px));
      max-width: 100%;
      aspect-ratio: 3 / 4;
      margin: auto;
      overflow: hidden;
      container-type: inline-size;
    }
    .ooo-exhibit__dialog {
      position: fixed;
      inset: 0;
      width: fit-content;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 28px);
      max-height: calc(100dvh - 28px);
      margin: auto;
      padding: 49px 14px 14px;
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid rgb(106 227 224 / 48%);
      border-radius: 16px;
      background: #090c10;
      color: #dbe7ea;
      box-shadow: 0 24px 90px rgb(0 0 0 / 70%);
    }
    .ooo-exhibit__dialog::backdrop { background: rgb(3 4 8 / 94%); }
    .ooo-exhibit__full-image {
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, 900px);
      max-height: calc(100vh - 96px);
      max-height: calc(100dvh - 96px);
      margin: auto;
      object-fit: contain;
    }
    .ooo-exhibit__close {
      position: absolute;
      top: 4px;
      right: 6px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #dbe7ea;
      cursor: pointer;
    }
    .ooo-exhibit__close:hover { background: rgb(106 227 224 / 9%); }
    .ooo-exhibit__close svg { width: 19px; height: 19px; }
    @media (max-width: 649px) {
      .ooo-exhibit { padding: 28px 22px 38px; }
      .ooo-exhibit__pair { grid-template-columns: minmax(0, 1fr); gap: 34px; }
      .ooo-device { width: min(100%, 420px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ooo-heart { transition: none; }
      .ooo-device--wheel .ooo-device__screen:active .ooo-heart {
        transform: translate(-50%, -50%);
      }
      .ooo-exhibit *, .ooo-exhibit *::before, .ooo-exhibit *::after {
        scroll-behavior: auto;
      }
    }
  </style>

<!-- OOO COMPONENT SCRIPT START -->
<script>
(() => {
  'use strict';
  document.querySelectorAll('.ooo-exhibit').forEach((exhibit) => {
    if (exhibit.dataset.oooReady) return;
    exhibit.dataset.oooReady = 'true';
    const viewer = exhibit.querySelector('.ooo-exhibit__dialog');
    const fullView = viewer.querySelector('.ooo-exhibit__full-view');
    const fullImage = fullView.querySelector('.ooo-exhibit__full-image');
    const closeButton = viewer.querySelector('.ooo-exhibit__close');
    let returnFocus = null;
    exhibit.querySelectorAll('[data-ooo-open]').forEach((trigger) => {
      trigger.addEventListener('click', () => {
        const device = trigger.closest('.ooo-device');
        const photo = device.querySelector('.ooo-device__image');
        const overlay = device.querySelector('[data-ooo-overlay]');
        fullView.querySelector('[data-ooo-overlay]')?.remove();
        fullView.append(overlay.cloneNode(true));
        returnFocus = trigger;
        fullImage.src = photo.currentSrc || photo.src;
        fullImage.alt = photo.alt;
        viewer.setAttribute('aria-label', 'Full photograph: ' + photo.alt);
        viewer.showModal();
        closeButton.focus({ preventScroll: true });
      });
    });
    closeButton.addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', (event) => {
      if (event.target !== viewer) return;
      const bounds = viewer.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (outside) viewer.close();
    });
    // Native dialog handles Escape and keeps keyboard focus inside the viewer.
    viewer.addEventListener('close', () => {
      fullImage.removeAttribute('src');
      fullImage.alt = '';
      fullView.querySelector('[data-ooo-overlay]')?.remove();
      if (returnFocus && returnFocus.isConnected) {
        returnFocus.focus({ preventScroll: true });
      }
    });
  });
})();
</script>
<!-- OOO COMPONENT SCRIPT END -->
