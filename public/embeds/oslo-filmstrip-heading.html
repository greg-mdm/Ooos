<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allies in Arts: Oslo has eyes for you</title>
<!-- Slow Stream "Watch" page: the Oslo section heading (Greg, 2026-11-23).
     The same format as the Golden Circle heading, a shade darker: the
     heading panel in cloud grey #DADADA deepening to darker cloud greys
     through the middle, and below it four of Greg's Oslo photos as square
     frames edge to edge, a thin #DADADA line between them. Four across on
     wide screens, two by two on phones. The squares set the height: about
     1270 x 470 on desktop and 281 x 400 on phones.
     Hosted at ooos.ca/embeds/oslo-filmstrip-heading.html; point a Wix Embed
     HTML element at it with Link. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #DADADA; }

  .os { container-type: inline-size; }

  /* the heading panel */
  .os__panel { padding: 2.4cqw 4cqw 2.6cqw; text-align: center;
    background:
      radial-gradient(26% 70% at 36% 42%, rgba(170, 168, 178, .55) 0%, rgba(170, 168, 178, 0) 100%),
      radial-gradient(22% 60% at 60% 60%, rgba(178, 177, 184, .50) 0%, rgba(178, 177, 184, 0) 100%),
      radial-gradient(18% 55% at 72% 30%, rgba(206, 206, 210, .55) 0%, rgba(206, 206, 210, 0) 100%),
      linear-gradient(90deg, #DADADA 0%, #CFCED3 16%, #BDBCC3 36%, #B5B4BB 50%, #C4C3C8 64%, #D3D2D5 80%, #DADADA 100%); }
  .os__title { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 3.3cqw; line-height: 1.12; letter-spacing: -.01em; color: #06021C; text-wrap: balance; }
  .os__place { margin: .2em 0 0; font-family: 'Poppins', sans-serif; font-weight: 300; font-size: 4.4cqw; line-height: 1; letter-spacing: .02em; color: #2A2A2A; }

  /* four square photos, edge to edge, a thin light line between */
  .os__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .os__frame { margin: 0; aspect-ratio: 1 / 1; overflow: hidden; background: #0A090B; }
  .os__frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .os__frame--hat img { object-position: 50% 26%; }
  .os__frame--baby img { object-position: 66% 50%; }
  .os__frame--sphere img { object-position: 20% 55%; }
  .os__frame--sit img { object-position: 50% 50%; }

  @container (max-width: 600px) {
    .os__panel { padding: 5cqw 6cqw 5.4cqw; }
    .os__title { font-size: 7.2cqw; }
    .os__place { font-size: 10cqw; }
    .os__grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
  }
</style>
</head>
<body>
<section class="os" aria-labelledby="os-title">
  <div class="os__panel">
    <h2 class="os__title" id="os-title">Allies in Arts: Oslo has eyes for you</h2>
    <p class="os__place">NORWAY</p>
  </div>
  <div class="os__grid">
    <figure class="os__frame os__frame--hat"><img src="/assets/slowstream/oslo-statue-red-hat.webp" width="640" height="853" alt="A bronze statue of a standing woman in a wide red hat and red heels on a plaza in Oslo"></figure>
    <figure class="os__frame os__frame--baby"><img src="/assets/slowstream/oslo-stencil-baby.webp" width="640" height="853" alt="A stencil of a stomping, crying baby on a concrete wall above an Oslo road, signed LA STAA"></figure>
    <figure class="os__frame os__frame--sphere"><img src="/assets/slowstream/oslo-bronze-sphere.webp" width="640" height="800" alt="Close-up of a textured bronze sphere sculpture split like a smile, an office building glowing behind it at dusk"></figure>
    <figure class="os__frame os__frame--sit"><img src="/assets/slowstream/oslo-reclining-statue-square.webp" width="800" height="800" alt="A reclining bronze statue in a red hat and golden sandals, a blue cup beside her, on a plaza in Oslo"></figure>
  </div>
</section>
</body>
</html>
