<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land acknowledgement · Slow Stream</title>
<!-- Slow Stream homepage: the land acknowledgement as one small edge-to-edge
     panel (Greg, 2026-11-27; recut 2026-11-28). The Toronto street sign on
     the left with the welcome under it, the eyebrow and one sentence in the
     middle, the Slow Stream logo on the right, the whole panel a link to the
     Ontario page. The panel wears the brand gradient from the Slow Stream
     wave card (lavender #DBCDFA down to violet #9E69F2). The sign and its
     Tkarón:to flip come from ontario-regions-welcome.html; the waves and the
     live Raleway wordmark come from slowstream-footer.html. Images load from
     ooos.ca.
     Hosted at ooos.ca/embeds/land-ack-panel.html: point a Wix Embed HTML
     element at it with Website address. The link destination defaults to
     https://www.slowstream.ca/ontario; override it from Wix with ?to=<url>
     on the embed address. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Jost:wght@700&family=Raleway:ital,wght@1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --electric: #6C0BF4;
    --amethyst: #4A0F8A;
    --indigo: #19007D;
    --night: #06021C;
    --ink: #170735;
    --lav-top: #DBCDFA;
    --lav-mid: #C5A7F5;
    --lav-low: #9E69F2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--night); background: var(--lav-top); -webkit-font-smoothing: antialiased; }
  p { margin: 0; }

  /* edge to edge: the embed IS the canvas. The panel is the link. */
  .panel { display: flex; flex-direction: column; min-height: 100%; }
  .ack {
    flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 3fr); align-items: center; gap: 0 clamp(24px, 3.2vw, 44px);
    padding: clamp(22px, 2.6vw, 30px) clamp(28px, 4vw, 56px);
    text-decoration: none; color: inherit;
    background: linear-gradient(180deg, var(--lav-top) 0%, var(--lav-mid) 48%, var(--lav-low) 100%);
  }
  .ack:focus-visible { outline: 3px solid var(--electric); outline-offset: -3px; }

  /* the sign, kept small, with the welcome hung on its centre line under it */
  .ack__left { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .ack__sign { position: relative; display: block; width: 100%; max-width: 280px; margin: 0 auto; container-type: inline-size; filter: drop-shadow(0 6px 14px rgba(25, 5, 46, .22)); }
  .ack__sign img { display: block; width: 100%; height: auto; }
  .ack__sign-face { display: block; transition: opacity .45s ease; }
  .ack__sign-face--two { position: absolute; inset: 0; opacity: 0; }
  .ack__sign-name { position: absolute; left: 50%; top: 54.5%; transform: translate(-50%, -50%); font-family: 'Jost', 'Poppins', sans-serif; font-weight: 700; font-size: 6.4cqw; line-height: 1; letter-spacing: .05em; white-space: nowrap; color: #08031C; text-shadow: .1cqw .3cqw .35cqw rgba(25, 5, 46, .35); }
  .ack:hover .ack__sign-face--one, .ack:focus-visible .ack__sign-face--one, .ack.is-tkaronto .ack__sign-face--one { opacity: 0; }
  .ack:hover .ack__sign-face--two, .ack:focus-visible .ack__sign-face--two, .ack.is-tkaronto .ack__sign-face--two { opacity: 1; }

  /* both lines hang on the sign's centre line: "to" sits on it, and the
     contrast icon sits directly under "to". Each line is a three-column grid
     (1fr auto 1fr) so the middle piece is centred whatever the outer words weigh. */
  .ack__cue { display: flex; flex-direction: column; gap: 2px; width: 100%; color: var(--indigo); }
  .ack__welcome, .ack__line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: .45em; white-space: nowrap; }
  .ack__welcome > :first-child, .ack__line > :first-child { text-align: right; justify-self: end; }
  .ack__welcome > :last-child, .ack__line > :last-child { text-align: left; justify-self: start; }
  .ack__welcome { font-family: 'Poppins', sans-serif; font-size: .68rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--indigo); column-gap: .35em; }
  .ack__line { font-family: 'Poppins', sans-serif; font-size: .95rem; font-weight: 500; line-height: 1.3; color: var(--indigo); }
  .ack__line svg { width: 1.05em; height: 1.05em; display: block; }

  /* the words */
  .ack__text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .ack__eyebrow { font-family: 'Poppins', sans-serif; font-size: .78rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--amethyst); }
  .ack__lead { font-family: 'Poppins', sans-serif; font-size: clamp(1.2rem, 1.8vw, 1.5rem); font-weight: 500; line-height: 1.35; color: var(--night); text-wrap: balance; max-width: 26ch; }

  /* the logo: the transparent waves with the wordmark in their pocket, as the
     footer has it. The LAND ACKNOWLEDGEMENT eyebrow sits above it, its left edge
     on the same 9.6% line as the "Slow" of the wordmark. */
  .logo { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin: 0 0 0 auto; container-type: inline-size; }
  .logo .ack__eyebrow { margin-left: 9.6%; }
  .logo__art { position: relative; width: 100%; filter: drop-shadow(0 6px 14px rgba(25, 5, 46, .18)); }
  .logo img { display: block; width: 100%; height: auto; }
  .logo__word { position: absolute; left: 9.6%; top: -1%; margin: 0; white-space: nowrap;
    font-family: 'Raleway', sans-serif; font-style: italic; font-weight: 700; font-size: 10.6cqw; line-height: 1; letter-spacing: -.005em;
    color: var(--ink);
    text-shadow: 0 .03em 0 rgba(255, 255, 255, .38), 0 -.02em .03em rgba(6, 2, 28, .35); }
  .pebble { display: inline-block; width: .19em; height: .19em; margin-left: .06em; border-radius: 50%; background: currentColor; box-shadow: 0 .03em 0 rgba(255, 255, 255, .38); }

  /* stacked below 821px: sign and welcome, the words, the logo, all centred */
  @media (max-width: 820px) {
    .ack { grid-template-columns: minmax(0, 1fr); gap: 18px 0; text-align: center; padding: 26px 22px 28px; }
    .ack__sign { max-width: 260px; }
    .ack__text { align-items: center; }
    .logo { margin: 0 auto; max-width: 240px; }
    .logo .ack__eyebrow { margin-left: 0; text-align: center; }
  }
  /* phone: Wix draws its mobile page on a 320 px canvas; this is drawn at the
     editor width (281) and the script zooms it to the real width */
  @media (max-width: 480px) {
    .ack { gap: 14px 0; padding: 20px 16px 22px; }
    .ack__sign { max-width: 220px; }
    .ack__eyebrow { font-size: .68rem; letter-spacing: .18em; }
    .ack__lead { font-size: 1.08rem; max-width: none; }
    .ack__welcome { font-size: .6rem; }
    .ack__line { font-size: .86rem; }
    .logo { max-width: 200px; }
  }
  @media (prefers-reduced-motion: reduce) { .ack__sign-face { transition: none; } }
</style>
</head>
<body>
  <div class="panel">
    <a class="ack" id="ack" href="https://www.slowstream.ca/ontario" target="_top" aria-label="Land acknowledgement. With gratitude, we live and work on Indigenous lands in Toronto, Canada. Welcome to Ontario: open for business, yours to discover. Slow Stream">
      <span class="ack__left">
      <span class="ack__sign" role="img" aria-label="Street sign reading Toronto, Canada, which turns to read Tkar&oacute;n:to">
        <picture class="ack__sign-face ack__sign-face--one">
          <source type="image/webp" srcset="https://ooos.ca/assets/slowstream/toronto-canada-sign-640.webp 640w, https://ooos.ca/assets/slowstream/toronto-canada-sign-1200.webp 1200w" sizes="(min-width: 821px) 280px, 80vw">
          <img src="https://ooos.ca/assets/slowstream/toronto-canada-sign-1200.webp" width="2484" height="816" alt="" decoding="async">
        </picture>
        <span class="ack__sign-face ack__sign-face--two" aria-hidden="true">
          <img src="https://ooos.ca/assets/slowstream/toronto-sign-blank-1200.webp" srcset="https://ooos.ca/assets/slowstream/toronto-sign-blank-640.webp 640w, https://ooos.ca/assets/slowstream/toronto-sign-blank-1200.webp 1200w" sizes="(min-width: 821px) 280px, 80vw" width="2484" height="816" alt="" loading="lazy" decoding="async">
          <span class="ack__sign-name" lang="moh">Tkar&oacute;n:to</span>
        </span>
      </span>
      <span class="ack__cue">
        <span class="ack__welcome"><span>Welcome</span><span>to</span><span>Ontario</span></span>
        <span class="ack__line"><span>Open for business</span>
          <!-- the contrast icon: the business half in indigo, the discovery half in lavender -->
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2.9a9.1 9.1 0 0 0 0 18.2Z" fill="#19007D" />
            <path d="M12 2.9a9.1 9.1 0 0 1 0 18.2Z" fill="#E6E6FA" />
            <circle cx="12" cy="12" r="9.1" fill="none" stroke="#19007D" stroke-width="1.7" />
          </svg>
          <span>Yours to discover</span></span>
      </span>
      </span>
      <span class="ack__text">
        <span class="ack__lead">With gratitude, we live and work on Indigenous lands in Toronto, Canada.</span>
      </span>
      <span class="logo">
        <span class="ack__eyebrow">Land acknowledgement</span>
        <span class="logo__art" role="img" aria-label="Slow Stream">
          <img src="https://ooos.ca/assets/slowstream/slow-stream-waves-1200.webp" srcset="https://ooos.ca/assets/slowstream/slow-stream-waves-640.webp 640w, https://ooos.ca/assets/slowstream/slow-stream-waves-1200.webp 1200w" sizes="(min-width: 821px) 300px, 70vw" width="1200" height="562" alt="" decoding="async">
          <span class="logo__word" aria-hidden="true">Slow Stream<span class="pebble"></span></span>
        </span>
      </span>
    </a>
  </div>

<script>
  (function () {
    /* the destination: ?to=<url> on the embed address wins over the default */
    var ack = document.getElementById("ack");
    var m = /[?&]to=([^&]+)/.exec(location.search);
    if (m) {
      try {
        var u = new URL(decodeURIComponent(m[1]), "https://www.slowstream.ca/");
        if (/^https?:$/.test(u.protocol)) ack.href = u.href;
      } catch (e) {}
    }

    /* Wix scales every element with the window (desktop drawn on a ~1280 px
       canvas, phones on a 320 px one). The layout is drawn at the editor width
       (1270 desktop, 281 phone) and zoomed by the same factor; if the Wix box is
       taller than the content, the panel stretches to fill it. */
    var panel = document.querySelector(".panel");
    function fit() {
      var root = document.documentElement;
      var w = root.clientWidth, h = root.clientHeight;
      var z = w <= 480 ? w / 281 : (w >= 1000 ? w / 1270 : 1);
      document.body.style.zoom = String(z);
      panel.style.minHeight = (h / z) + "px";
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("load", fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

    /* touch screens have no hover: the first tap turns the sign, the second follows the link */
    if (window.matchMedia("(hover: none)").matches) {
      ack.addEventListener("click", function (e) {
        if (!ack.classList.contains("is-tkaronto")) { e.preventDefault(); ack.classList.add("is-tkaronto"); }
      });
    }
  })();
</script>
</body>
</html>
