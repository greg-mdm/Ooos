<section class="ooo-exhibit" aria-label="Museum anatomy exhibition">
  <div class="ooo-exhibit__pair">
    <figure class="ooo-device ooo-device--saxophone" aria-label="Anatomy exhibit playing a saxophone">
      <button class="ooo-device__screen" type="button" data-ooo-open aria-haspopup="dialog" aria-label="View full photograph of the anatomy exhibit playing a saxophone" title="View full photograph">
        <img class="ooo-device__image" src="/assets/exhibition/anatomy/saxophone.jpg" width="720" height="960" decoding="async" alt="Museum anatomy exhibit posed playing a brass saxophone, with visible muscles and organs.">
        <span class="ooo-purpose" data-ooo-overlay>
          <svg class="ooo-purpose__music" data-ionicon="musical-notes-outline" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M192,218v-6c0-14.84,10-27,24.24-30.59l174.59-46.68A20,20,0,0,1,416,154V176" style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px"/><path d="M416,295.94v80c0,13.91-8.93,25.59-22,30l-22,8c-25.9,8.72-52-10.42-52-38h0a33.37,33.37,0,0,1,23-32l51-18.15c13.07-4.4,22-15.94,22-29.85V58a10,10,0,0,0-12.6-9.61L204,102a16.48,16.48,0,0,0-12,16v226c0,13.91-8.93,25.6-22,30l-52,18c-13.88,4.68-22,17.22-22,32h0c0,27.58,26.52,46.55,52,38l22-8c13.07-4.4,22-16.08,22-30v-80" style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px"/></svg>
          <strong class="ooo-purpose__title">PLAY WITH PURPOSE!</strong>
          <span class="ooo-purpose__lead">Canadian Interactive Exhibition (CIX) is all about that...</span>
          <span class="ooo-purpose__triad">
            <span class="ooo-purpose__entry">
              <svg class="ooo-purpose__icon ooo-purpose__icon--banknote" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect x="1.5" y="2.5" width="61" height="35" rx="3"/>
                <path class="ooo-purpose__accent" d="M7 12V8h8m34 0h8v4M7 28v4h8m34 0h8v-4"/>
                <text x="32" y="21" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">$</text>
                <text x="32" y="34" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".4">CAD</text>
              </svg>
              <span class="ooo-purpose__label">DOUGH</span>
            </span>
            <span class="ooo-purpose__entry">
              <svg class="ooo-purpose__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="24" cy="24" r="8"/>
                <path d="M24 5v6m0 26v6M5 24h6m26 0h6M10.6 10.6l4.2 4.2m18.4 18.4 4.2 4.2m0-26.8-4.2 4.2M14.8 33.2l-4.2 4.2"/>
                <path class="ooo-purpose__accent" d="M21 28a5 5 0 0 0 7-7"/>
              </svg>
              <span class="ooo-purpose__label">RAY</span>
            </span>
            <span class="ooo-purpose__entry">
              <svg class="ooo-purpose__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="24" cy="13" r="4"/>
                <circle cx="11" cy="18" r="3"/>
                <circle cx="37" cy="18" r="3"/>
                <path d="M17 35v-7a7 7 0 0 1 14 0v7M5 34v-5a6 6 0 0 1 9-5.2M43 34v-5a6 6 0 0 0-9-5.2"/>
                <path class="ooo-purpose__accent" d="M13 40h22"/>
              </svg>
              <span class="ooo-purpose__label">WE</span>
            </span>
          </span>
        </span>
      </button>
      <button class="ooo-device__expand" type="button" data-ooo-open aria-haspopup="dialog" aria-label="Expand the saxophone photograph" title="View full photograph"></button>
    </figure>
    <figure class="ooo-device ooo-device--wheel" aria-label="Anatomy exhibit at a ship's wheel">
      <button class="ooo-device__screen" type="button" data-ooo-open aria-haspopup="dialog" aria-label="View full photograph of the anatomy exhibit at a ship's wheel" title="View full photograph">
        <img class="ooo-device__image" src="/assets/exhibition/anatomy/wheel.jpg" width="720" height="960" decoding="async" alt="Museum anatomy exhibit showing facial and upper-body muscles, posed holding a yellow ship's wheel.">
        <!-- Greg's "Share your passion heart button" (2026-10-12) in place of
             the drawn heart; the file is his, served as a WebP with its alpha -->
        <span class="ooo-heart" data-ooo-overlay role="img" aria-label="Share your passion. A laptop screen with a flame and a megaphone, on a heart.">
          <img class="ooo-heart__img" src="/assets/exhibition/anatomy/share-your-passion-heart.webp" width="1303" height="1207" alt="" decoding="async">
        </span>
      </button>
      <button class="ooo-device__expand" type="button" data-ooo-open aria-haspopup="dialog" aria-label="Expand the ship's wheel photograph" title="View full photograph"></button>
    </figure>
  </div>
  <dialog class="ooo-exhibit__dialog" aria-label="Full exhibition photograph">
    <button class="ooo-exhibit__close" type="button" aria-label="Close full photograph" title="Close (Escape)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div class="ooo-exhibit__full-view">
      <img class="ooo-exhibit__full-image" alt="">

    </div>
  </dialog>
</section>
