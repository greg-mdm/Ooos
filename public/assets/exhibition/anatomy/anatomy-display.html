<section class="ooo-exhibit" aria-label="Museum anatomy exhibition">
  <div class="ooo-exhibit__pair">
    <figure class="ooo-device ooo-device--saxophone" aria-label="Anatomy exhibit playing a saxophone">
      <button class="ooo-device__screen" type="button" data-ooo-open aria-haspopup="dialog" aria-label="View full photograph of the anatomy exhibit playing a saxophone" title="View full photograph">
        <img class="ooo-device__image" src="/assets/exhibition/anatomy/saxophone.jpg" width="720" height="960" decoding="async" alt="Museum anatomy exhibit posed playing a brass saxophone, with visible muscles and organs.">
        <img class="ooo-purpose" data-ooo-overlay src="/assets/exhibition/anatomy/play-with-purpose-portal.webp" width="1200" height="508" decoding="async" alt="Play with purpose! Dough, Ray, We.">
      </button>
      <button class="ooo-device__expand" type="button" data-ooo-open aria-haspopup="dialog" aria-label="Expand the saxophone photograph" title="View full photograph"></button>
    </figure>
    <figure class="ooo-device ooo-device--wheel" aria-label="Anatomy exhibit at a ship's wheel">
      <button class="ooo-device__screen" type="button" data-ooo-open aria-haspopup="dialog" aria-label="View full photograph of the anatomy exhibit at a ship's wheel" title="View full photograph">
        <img class="ooo-device__image" src="/assets/exhibition/anatomy/wheel.jpg" width="720" height="960" decoding="async" alt="Museum anatomy exhibit showing facial and upper-body muscles, posed holding a yellow ship's wheel.">
        <!-- Greg's "Share your passion heart button" (2026-10-12; redrawn with lighter
             type and a three-node share icon, 2026-10-19) in place of
             the drawn heart; the file is his, served as a WebP with its alpha -->
        <span class="ooo-heart" data-ooo-overlay role="img" aria-label="Share your passion. A laptop screen with a flame and a share icon, on a heart.">
          <img class="ooo-heart__img" src="/assets/exhibition/anatomy/share-your-passion-heart-v2.webp" width="1303" height="1207" alt="" decoding="async">
        </span>
      </button>
      <button class="ooo-device__expand" type="button" data-ooo-open aria-haspopup="dialog" aria-label="Expand the ship's wheel photograph" title="View full photograph"></button>
    </figure>
  </div>
  <dialog class="ooo-exhibit__dialog" aria-label="Full exhibition photograph">
    <button class="ooo-exhibit__close" type="button" aria-label="Close full photograph" title="Close (Escape)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div class="ooo-exhibit__full-view">
      <img class="ooo-exhibit__full-image" alt="">

    </div>
  </dialog>
</section>
