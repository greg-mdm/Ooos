<svg xmlns="http://www.w3.org/2000/svg" width="352" height="342" viewBox="-26 -26 352 342">
  <defs>
    <path id="heart" d="M145 277C125 256 14 198 14 103C14 33 80 11 119 43C132 53 142 66 147 76Q150 82 153 76C158 66 168 53 181 43C220 11 286 33 286 103C286 198 175 256 155 277Q150 282 145 277Z"/>
    <linearGradient id="rolled-ridge" x1="25" y1="25" x2="255" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F4F5"/>
      <stop offset=".15" stop-color="#E8ECF4"/>
      <stop offset=".33" stop-color="#B4A6D8"/>
      <stop offset=".53" stop-color="#703EC0"/>
      <stop offset=".77" stop-color="#351060"/>
      <stop offset="1" stop-color="#0F031C"/>
    </linearGradient>
    <radialGradient id="purple-face" cx="80" cy="60" r="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8961BF"/>
      <stop offset=".29" stop-color="#6735B7"/>
      <stop offset=".64" stop-color="#4B00B6"/>
      <stop offset=".84" stop-color="#3C0895"/>
      <stop offset="1" stop-color="#220845"/>
    </radialGradient>
    <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.15"/></filter>
    <filter id="blend" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <mask id="ridge-only" maskUnits="userSpaceOnUse" x="-26" y="-26" width="352" height="342">
      <use href="#heart" fill="white"/>
      <use href="#heart" fill="black" transform="translate(150 145) scale(.925) translate(-150 -145)" filter="url(#blend)"/>
    </mask>
    <filter id="rounded-face" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="soft-alpha"/>
      <feOffset in="soft-alpha" dx="5" dy="7" result="lit-offset"/>
      <feComposite in="SourceAlpha" in2="lit-offset" operator="out" result="lit-edge"/>
      <feFlood flood-color="#F0F4F5" flood-opacity=".27" result="light"/>
      <feComposite in="light" in2="lit-edge" operator="in" result="rim-light"/>
      <feOffset in="soft-alpha" dx="-7" dy="-9" result="dark-offset"/>
      <feComposite in="SourceAlpha" in2="dark-offset" operator="out" result="dark-edge"/>
      <feFlood flood-color="#06021C" flood-opacity=".54" result="dark"/>
      <feComposite in="dark" in2="dark-edge" operator="in" result="rim-dark"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rim-light"/><feMergeNode in="rim-dark"/></feMerge>
      <feGaussianBlur stdDeviation=".65"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="5" dy="8" result="shadow-offset"/>
      <feFlood flood-color="#06021C" flood-opacity=".43" result="shadow-colour"/>
      <feComposite in="shadow-colour" in2="shadow-offset" operator="in" result="shadow"/>
      <feOffset in="blur" dx="-3" dy="-4" result="light-offset"/>
      <feFlood flood-color="#F0F4F5" flood-opacity=".2" result="light-colour"/>
      <feComposite in="light-colour" in2="light-offset" operator="in" result="light"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <use href="#heart" fill="#0F031C" fill-opacity=".2" transform="translate(1.5 3)" filter="url(#blend)"/>
    <use href="#heart" fill="url(#rolled-ridge)" fill-opacity=".95" mask="url(#ridge-only)" filter="url(#feather)"/>
    <use href="#heart" fill="url(#purple-face)" fill-opacity=".9" transform="translate(150 145) scale(.925) translate(-150 -145)" filter="url(#rounded-face)"/>
  </g>
</svg>