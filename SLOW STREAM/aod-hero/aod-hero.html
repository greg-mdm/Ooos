<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow searches for home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #F0C040; --ink: rgba(4, 1, 14, 0.94); }
  html, body { margin: 0; padding: 0; background: #06021c; }
  .aod { position: relative; margin: 0; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #06021c; }
  .aod video, .aod img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .aod__disc {
    position: absolute; z-index: 1; left: 4.5vw; bottom: 4.5vw;
    width: clamp(132px, 36vw, 190px); aspect-ratio: 1 / 1; border-radius: 50%;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0.5em;
    padding: 6%; box-sizing: border-box; text-align: center;
    background: var(--ink); border: 1px solid rgba(240, 192, 64, 0.32);
    box-shadow: 0 10px 32px rgba(3, 1, 10, 0.6);
    font-family: Poppins, Montserrat, system-ui, sans-serif; font-weight: 700;
  }
  .aod__cap { color: var(--gold); font-size: clamp(0.52rem, 2.3vw, 0.68rem); letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .aod__line { color: #fff; font-size: clamp(0.95rem, 4.3vw, 1.3rem); line-height: 1.12; letter-spacing: 0.02em; }
  @media (max-width: 720px) {
    .aod { aspect-ratio: 4 / 3; }
    .aod video, .aod img { object-position: 28% 12%; }
    .aod__disc { display: flex; left: auto; right: 4.5vw; bottom: 4.5vw; }
  }
</style>
</head>
<body>
<figure class="aod" id="aod">
  <video id="aodVideo" muted playsinline preload="metadata"
         disablepictureinpicture disableremoteplayback
         controlslist="nodownload noplaybackrate noremoteplayback"
         aria-label="Shadow, a white sheet ghost, stands on a rainy Toronto plaza; a small hooded kin approaches from far behind"></video>
  <span class="aod__disc" aria-hidden="true">
    <span class="aod__cap">Art on demand</span>
    <span class="aod__line">Shadow<br>searches<br>for home</span>
  </span>
</figure>
<script>
(function () {
  var BASE = "https://ooos.ca/assets/exhibition/";
  var SRC = {
    desktop: { mp4: BASE + "shadow-host-aod.mp4", poster: BASE + "shadow-host-aod-poster.webp", still: BASE + "shadow-host-aod-end.webp" },
    phone:   { webm: BASE + "shadow-host.webm", mp4: BASE + "shadow-host.mp4", poster: BASE + "shadow-host-poster.webp", still: BASE + "shadow-host-poster.webp" }
  };
  var phone = window.matchMedia("(max-width: 720px)").matches;
  var set = phone ? SRC.phone : SRC.desktop;
  var v = document.getElementById("aodVideo");
  var fig = document.getElementById("aod");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var img = document.createElement("img");
    img.src = set.still; img.alt = v.getAttribute("aria-label");
    fig.replaceChild(img, v);
    return;
  }
  v.poster = set.poster;
  if (set.webm) { var w = document.createElement("source"); w.src = set.webm; w.type = "video/webm"; v.appendChild(w); }
  var m = document.createElement("source"); m.src = set.mp4; m.type = "video/mp4"; v.appendChild(m);
  var played = false;
  function start() { if (played) return; played = true; v.play().catch(function () {}); }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { start(); io.disconnect(); } });
    }, { threshold: 0.25 });
    io.observe(v);
  } else { start(); }
})();
</script>
</body>
</html>
